db_path: "db/noshow.db"

# LLM Configuration
llm:
   model_name: "sqlcoder:7b"
   model_provider: "ollama"
   temperature: 0

# RAG Configuration
rag:
   # Hybrid retrieval weights (must sum to 1.0)
   dense_weight: 0.3 # FAISS semantic search weight
   sparse_weight: 0.7 # BM25 keyword search weight
   k: 3 # Number of documents to retrieve
   sample_limit: 5 # Number of sample records to include per table
   embedding_model: "all-MiniLM-L6-v2" # HuggingFace embedding model

# Currency Conversion Configuration
currency:
   base_currency: "SGD"
   conversion_rates:
      SGD: 1.0
      USD: 1.35
      EUR: 1.45
      GBP: 1.70

prompt_template: |
   ### Task
   Generate a SQL query to answer [QUESTION]{question}[/QUESTION].
   The query must be logically correct in all cases implied by the question, including situations where eligibility of records depends on aggregated properties of groups and where selecting a fixed number of records applies independently within each such group rather than to the result set as a whole.
   Do not simplify the query in ways that would change the meaning of the question when multiple groups or ranking criteria are involved.

   ### Database Schema
   The query will run on a database with the following schema:
   {db_schema}

   ### Answer
   Given the database schema, here is the SQL query that answers [QUESTION]{question}[/QUESTION].
   If ensuring correctness requires intermediate result sets or multi-stage evaluation, structure the query accordingly.
   [SQL]
