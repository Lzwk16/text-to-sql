# Optional sample database served when a request has no db_id
default_db: "db/noshow.db"

# LLM (Groq reads GROQ_API_KEY from the environment / .env).
llm:
   model_name: "qwen/qwen3.8-27b"
   model_provider: "groq"
   temperature: 0

# Schema context sent to the LLM, currently still WIP
retrieval:
   sample_limit: 3 # sample rows per table sent to the cloud LLM; 0 disables
   full_schema_max_tables: 8 # at or below this, send the whole schema
   k: 5 # tables retrieved for larger schemas (plus FK neighbours)
   dense_weight: 0.3
   sparse_weight: 0.7
   embedding_model: "all-MiniLM-L6-v2"

guardrails: # limits on what a query may do
   max_rows: 500
   query_timeout_s: 10

agent_loop: # how the generate -> execute -> retry loop behaves
   max_attempts: 3 # SQL generation attempts per question (errors and empty results retry)
   history_turns: 5 # earlier turns shown to the model for follow-up questions; 0 = off

uploads:
   dir: "temp_uploads"
   max_mb: 200
   ttl_hours: 24 # uploads older than this are deleted (checked by modified time)
   cleanup_interval_min: 30 # how often the server checks; also runs at startup and on upload

checkpoint_db: "data/checkpoints.db"

# Optional, non-mutating conversion of numbers stored as text in result columns.
# Each converter below auto-detects its own columns and does nothing when a
# result has none, so it is safe on any database.
# `default_enabled` lists converters that are on when a request does not choose;
# the UI multi-select / API field `conversions` overrides it per request.
postprocess:
   default_enabled: []
   currency: # 'USD$ 12.30' -> number in base_currency. Rates are static, relative to base.
      base_currency: "SGD"
      conversion_rates:
         SGD: 1.0
         USD: 1.35
         EUR: 1.45
         GBP: 1.70
   units: # '5 kg', '30 cm', '98 °F' -> one target unit per dimension (pint)
      targets:
         length: km
         mass: kg
         volume: l
         temperature: C # C or F
   durations: # '2h 30m', '1:30:00' -> one target unit
      target: minutes # seconds, minutes, hours or days
   numbers: {} # '1,234.50', '1.2K', '(123)' -> plain numbers
   datetime: # '05/10/1973', '01/01/2023 0:00' -> ISO 8601 text
      dayfirst: true # reading of ambiguous numeric dates; false = month first
